openapi: 3.1.0
info:
  title: Oneflow virtual keys (proposed)
  version: 0.1.0
  description: |
    Design-only management API extension. These routes are NOT implemented.
    Do not generate production clients from this document yet.
    All operations require an authenticated management administrator; inference
    virtual keys must never authorize management operations.
    See ../docs/L2-detailed-design/virtual-keys.md for lifecycle and lease semantics.
servers:
  - url: http://127.0.0.1:4000
security:
  - adminBearerAuth: []
paths:
  /v1/virtual-keys:
    post:
      operationId: createVirtualKey
      summary: Create an immutable virtual key and reveal its secret once
      description: |
        Commits the key and policy revision durably before responding.
        A successful response does not mean every daemon has applied the policy.
        The plaintext secret is not retained and cannot be recovered.
        A lost response requires creating a replacement and revoking the old key;
        automatic retries may create additional keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVirtualKey"
      responses:
        "201":
          description: Created; the only response containing the plaintext key
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedVirtualKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listVirtualKeys
      summary: List key metadata, including revoked and expired keys
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: Opaque continuation cursor; malformed cursors return 400.
          schema:
            type: string
      responses:
        "200":
          description: Metadata ordered by created_at descending, then id descending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualKeyPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/virtual-keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    get:
      operationId: getVirtualKey
      summary: Get metadata without the secret or verification hash
      responses:
        "200":
          description: Key metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/virtual-keys/{key_id}/revoke:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    post:
      operationId: revokeVirtualKey
      summary: Permanently revoke a key
      description: |
        Idempotent: repeated revocation returns the original revoked_at.
        Revocation is durably committed before responding, then published to
        daemons. Existing leases can authorize new requests until refreshed
        or expired; already admitted requests are not interrupted.
      responses:
        "200":
          description: Revoked key metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    adminBearerAuth:
      type: http
      scheme: bearer
      description: Management administrator credential, never an inference virtual key.
  parameters:
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/KeyId"
  responses:
    BadRequest:
      description: Invalid JSON, field, expiry, model allowlist, or cursor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid administrator credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated caller is not a management administrator
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Key does not exist or the identifier is malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: Durable key storage is unavailable; no success is reported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    KeyId:
      type: string
      pattern: "^[0-9a-f]{32}$"
    CreateVirtualKey:
      type: object
      additionalProperties: false
      required: [name, allowed_models, expires_at]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Non-blank display label; need not be unique.
        allowed_models:
          type: array
          minItems: 1
          uniqueItems: true
          description: |
            Exact public model_name values, never upstream_model values.
            Wildcards are forbidden. All names must exist when creating the key.
            Models added later are not granted automatically.
          items:
            type: string
            minLength: 1
            pattern: "^[^*]+$"
        expires_at:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Unix seconds strictly after server time, or null for no key expiry.
    VirtualKey:
      type: object
      additionalProperties: false
      required: [id, name, allowed_models, created_at, expires_at, revoked_at]
      properties:
        id:
          $ref: "#/components/schemas/KeyId"
        name:
          type: string
        allowed_models:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        created_at:
          type: integer
          format: int64
          minimum: 0
        expires_at:
          type: [integer, "null"]
          format: int64
          minimum: 0
        revoked_at:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Null until permanently revoked. Revocation takes precedence over expiry.
    CreatedVirtualKey:
      type: object
      additionalProperties: false
      required: [key, secret]
      properties:
        key:
          $ref: "#/components/schemas/VirtualKey"
        secret:
          type: string
          pattern: "^ofk_[0-9a-f]{32}_[0-9a-f]{64}$"
          description: |
            ofk_<key id>_<32 cryptographically random bytes encoded as lowercase hex>.
            The key id must equal key.id. Never log this field.
    VirtualKeyPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VirtualKey"
        next_cursor:
          type: [string, "null"]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
