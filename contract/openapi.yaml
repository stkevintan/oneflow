openapi: 3.1.0
info:
  title: Oneflow API
  version: 1.0.0
  description: |
    Source-of-truth contract for the control-plane management API.

    The control plane is an API-only service (see
    `docs/adr/0001-api-only-stateless-control-plane.md`). It serves no HTML;
    every management client (web dashboard, CLI, TUI, desktop) is deployed
    separately and talks to this API.

    Contract-first workflow:
      1. This file is edited first.
      2. Rust DTOs are generated into `protocol/src/generated`
         (`openapi-to-rust`); TypeScript types into `web/src/api/schema.d.ts`
         (`openapi-typescript`). Run `scripts/generate-types.sh`.
      3. `cargo test -p control-plane` runs the contract tests in
         `control-plane/src/api.rs` against the real router.

    Conventions:
      * Management resources use `/v1`; LiteLLM-style key management uses `/key/*`.
      * Every error body is an `ErrorResponse`, including 404 for unknown paths.
      * `/v1` timestamps are Unix seconds (`int64`); `/key/*` uses RFC 3339.
      * `/v1` collections are wrapped in an object with an `items` array so they can
        gain pagination fields without breaking clients.

    Authentication: operations require `Authorization: Bearer <token>` unless
    they declare `security: []`. Authentication is enforced when virtual-key storage is configured;
    legacy mode retains the unauthenticated proof-of-concept API.

    Out of scope: the daemon WebSocket control channel (`/control`) is a
    transport endpoint, not a JSON resource; its messages are defined in
    `protocol/src/lib.rs`. Inference traffic never passes through the control
    plane.
servers:
  - url: http://127.0.0.1:4000
    description: Local control plane (see config.toml)
security:
  - bearerAuth: []
tags:
  - name: system
    description: Liveness and server summary
  - name: config
    description: Desired model configuration distributed to daemons
  - name: daemons
    description: Daemon connections currently attached to the control plane
  - name: usage
    description: Per-request usage reported by daemons

paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Unauthenticated. Returns 200 while the process can serve requests.
      tags: [system]
      security: []
      responses:
        "200":
          description: The service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/status:
    get:
      operationId: getStatus
      summary: Server summary
      tags: [system]
      responses:
        "200":
          description: Server summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/config:
    get:
      operationId: getConfig
      summary: Read the desired model configuration
      tags: [config]
      responses:
        "200":
          description: The configuration currently distributed to daemons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelConfigSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putConfig
      summary: Replace the desired model configuration
      description: |
        Stores the configuration as the new desired state and pushes it to
        every connected daemon. Daemons that connect later receive it on
        connect. The whole configuration is replaced; models absent from the
        body are removed from every daemon.
      tags: [config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelConfigSet"
      responses:
        "200":
          description: The stored configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelConfigSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/daemons:
    get:
      operationId: listDaemons
      summary: List connected daemons
      tags: [daemons]
      responses:
        "200":
          description: One entry per live control-channel connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/daemons/{connection_id}:
    get:
      operationId: getDaemon
      summary: Read one daemon connection
      tags: [daemons]
      parameters:
        - name: connection_id
          in: path
          required: true
          description: Identifier assigned by the control plane when the daemon connected.
          schema:
            type: string
      responses:
        "200":
          description: The daemon connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Daemon"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/usage/events:
    get:
      operationId: listUsageEvents
      summary: List recent usage events, newest first
      description: |
        Cursor-paginated. Pass `next_cursor` from a page as `cursor` to read
        the next (older) page. The control plane retains a bounded history, so
        old events eventually disappear.
      tags: [usage]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of events to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous page's `next_cursor`.
          schema:
            type: string
        - name: daemon_id
          in: query
          required: false
          description: Only events reported by this daemon.
          schema:
            type: string
        - name: model_name
          in: query
          required: false
          description: Only events for this model.
          schema:
            type: string
      responses:
        "200":
          description: A page of usage events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /key/generate:
    post:
      operationId: generateKey
      summary: Generate a key (LiteLLM-style supported subset)
      description: |
        Commits the key and policy revision durably before responding.
        A successful response does not mean every daemon has applied the policy.
        The plaintext secret is not retained and cannot be recovered.
        A lost response requires creating a replacement and revoking the old key;
        automatic retries may create additional keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateKeyRequest"
      responses:
        "200":
          description: Created; the only response containing the plaintext key
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /key/list:
    get:
      operationId: listKeys
      summary: List non-deleted keys with LiteLLM-style pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: return_full_object
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Hash identifiers by default; metadata objects when return_full_object=true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /key/info:
    get:
      operationId: keyInfo
      summary: Get metadata using a key hash (preferred) or raw key
      description: |
        Requires an administrator token. Supply SHA-256 rather than a raw key
        to keep bearer secrets out of URL/access logs. The response always
        normalizes key to the hash and never echoes the raw secret.
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyInfoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /key/delete:
    post:
      operationId: deleteKeys
      summary: Delete keys from active use
      description: |
        Accepts plaintext keys or SHA-256 hashes; hashes are preferred.
        Atomically revokes all requested keys. Unknown identifiers return 404
        without deleting any key. Repeated deletion is idempotent. Metadata is
        retained for audit/info, but deleted keys are absent from key/list.
        Existing leases and admitted requests follow the bounded revocation rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteKeysRequest"
      responses:
        "200":
          description: Deleted identifiers normalized to hashes (never raw secrets)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteKeysResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Management administrator credential in virtual-key mode; never an inference virtual key.

  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Authenticated caller is not a management administrator
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unavailable:
      description: Durable key storage is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    GenerateKeyRequest:
      type: object
      additionalProperties: false
      required: [models]
      description: |
        LiteLLM-style subset. Explicit non-empty models are required; unlike
        LiteLLM, empty/omitted models do NOT grant all-model access. Unsupported
        fields (budgets, rate limits, metadata, user/team IDs) return 400.
      properties:
        key_alias:
          type: [string, "null"]
          minLength: 1
          maxLength: 128
          description: Optional display label; generated when omitted or null.
        models:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            pattern: "^[^*]+$"
        duration:
          type: [string, "null"]
          pattern: "^[0-9]+[smhd]$"
          description: Positive duration (for example 30d); omitted/null means no key expiry.
    KeyMetadata:
      type: object
      required: [token, token_id, key_alias, models, expires, created_at, blocked]
      properties:
        token:
          type: string
          description: SHA-256 identifier, not a usable inference credential.
        token_id:
          type: string
          description: Oneflow internal key ID, also used in telemetry.
        key_alias:
          type: string
        models:
          type: array
          items:
            type: string
        expires:
          type: [string, "null"]
          description: RFC 3339 UTC timestamp or null.
        created_at:
          type: string
          description: RFC 3339 UTC timestamp.
        blocked:
          type: boolean
          description: True when permanently deleted/revoked.
    GenerateKeyResponse:
      allOf:
        - $ref: "#/components/schemas/KeyMetadata"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: One-time plaintext key; starts with sk-. Never log it.
    KeyInfoResponse:
      type: object
      required: [key, info]
      properties:
        key:
          type: string
          description: Normalized SHA-256 key hash, including when lookup used plaintext.
        info:
          $ref: "#/components/schemas/KeyMetadata"
    KeyListResponse:
      type: object
      required: [keys, total_count, current_page, total_pages]
      properties:
        keys:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: "#/components/schemas/KeyMetadata"
        total_count:
          type: integer
          format: int64
        current_page:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
    DeleteKeysRequest:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
    DeleteKeysResponse:
      type: object
      required: [deleted_keys]
      properties:
        deleted_keys:
          type: array
          items:
            type: string
          description: Hashes only; plaintext inputs are never echoed.
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          description: Always `ok` when the service responds.
        version:
          type: string
          description: Control-plane build version.

    StatusResponse:
      type: object
      required: [version, uptime_seconds, connected_daemons, config_version]
      properties:
        version:
          type: string
          description: Control-plane build version.
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        connected_daemons:
          type: integer
          format: int64
          minimum: 0
        config_version:
          type: string
          description: Version label of the desired configuration.

    ModelConfigSet:
      type: object
      required: [version, models]
      properties:
        version:
          type: string
          description: Non-empty version label shown to operators and applied by daemons.
        models:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ModelConfig"

    ModelConfig:
      type: object
      required: [model_name, provider, api_base, parameters]
      properties:
        model_name:
          type: string
          description: Model identifier clients send to the daemon. Must be non-empty.
        provider:
          type: string
          description: Provider adapter, for example `custom_openai`.
        api_base:
          type: string
          format: uri
          description: Upstream base URL, for example `https://api.deepseek.com/v1`. Must be non-empty.
        parameters:
          type: object
          description: |
            Free-form provider options. `upstream_model` rewrites the model id
            sent upstream; `api_key_env` names an environment variable holding
            the upstream credential on the daemon host.
          additionalProperties:
            type: string

    DaemonList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Daemon"

    Daemon:
      type: object
      required:
        - connection_id
        - daemon_id
        - cluster_name
        - version
        - hostname
        - capabilities
        - connected_at
        - last_seen
        - active_requests
        - loaded_models
        - total_requests
        - failed_requests
        - total_prompt_tokens
        - total_completion_tokens
        - auth_policy_revision
        - auth_policy_valid_until
      properties:
        connection_id:
          type: string
          description: Identifier for this control-channel connection.
        daemon_id:
          type: [string, "null"]
          description: Null until the daemon sends its registration message.
        cluster_name:
          type: [string, "null"]
        version:
          type: [string, "null"]
        hostname:
          type: [string, "null"]
        capabilities:
          type: array
          items:
            type: string
        connected_at:
          type: integer
          format: int64
          description: Unix timestamp in seconds.
        last_seen:
          type: integer
          format: int64
          description: Unix timestamp in seconds of the last message received.
        active_requests:
          type: integer
          format: int64
          minimum: 0
        loaded_models:
          type: array
          items:
            type: string
        total_requests:
          type: integer
          format: int64
          minimum: 0
        failed_requests:
          type: integer
          format: int64
          minimum: 0
        total_prompt_tokens:
          type: integer
          format: int64
          minimum: 0
        total_completion_tokens:
          type: integer
          format: int64
          minimum: 0

        auth_policy_revision:
          type: [integer, "null"]
          format: int64
          description: Last acknowledged virtual-key policy revision.
        auth_policy_valid_until:
          type: [integer, "null"]
          format: int64
          description: Last acknowledged policy lease deadline, in Unix seconds.

    UsageEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/UsageEvent"
        next_cursor:
          type: [string, "null"]
          description: Cursor for the next (older) page, or null when there are no more events.

    UsageEvent:
      type: object
      required:
        - request_id
        - daemon_id
        - model_name
        - prompt_tokens
        - completion_tokens
        - usage_reported
        - success
        - status_code
        - latency_ms
        - streamed
        - received_at
        - virtual_key_id
      properties:
        request_id:
          type: string
          description: Daemon-generated id, echoed to the client in `x-daemon-request-id`.
        daemon_id:
          type: string
        model_name:
          type: string
        prompt_tokens:
          type: integer
          format: int64
          minimum: 0
        completion_tokens:
          type: integer
          format: int64
          minimum: 0
        usage_reported:
          type: boolean
          description: |
            False when the upstream returned no `usage` object. The token counts
            are then zero because they are unknown, not because they are zero.
        success:
          type: boolean
        status_code:
          type: [integer, "null"]
          minimum: 100
          maximum: 599
          description: Upstream HTTP status, or null when no response was received.
        latency_ms:
          type: integer
          format: int64
          minimum: 0
          description: Wall-clock duration of the upstream call as observed by the daemon.
        streamed:
          type: boolean
          description: Whether the client requested a streaming response.
        virtual_key_id:
          type: [string, "null"]
          description: Non-secret virtual key ID; null for legacy inference.
        received_at:
          type: integer
          format: int64
          description: Unix timestamp in seconds, stamped by the control plane on arrival.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
